name: Unity adapter contract tests

on:
  workflow_call:
    inputs:
      release-check-scope:
        description: Unique concurrency scope for a reusable release check.
        type: string
        required: false
        default: ''
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release-check-scope || github.ref }}
  cancel-in-progress: true

jobs:
  unity-contract:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore tests/Configlue.Hosting.Unity.Tests/Configlue.Hosting.Unity.Tests.csproj

      - name: Build
        run: >
          dotnet build tests/Configlue.Hosting.Unity.Tests/Configlue.Hosting.Unity.Tests.csproj
          --no-restore --configuration Release

      - name: Run Unity adapter contract tests
        run: >
          dotnet test tests/Configlue.Hosting.Unity.Tests/Configlue.Hosting.Unity.Tests.csproj
          --no-build --no-restore --configuration Release
          -- --timeout 5m --report-trx --results-directory TestResults --no-progress

      - name: Upload failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: unity-contract-results-${{ matrix.os }}
          path: |
            TestResults/**/*.trx
            tests/Configlue.Hosting.Unity.Tests/bin/Release/**/TestResults/**
          if-no-files-found: ignore
          retention-days: 7
