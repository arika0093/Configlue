name: Packed package consumers

on:
  workflow_call:
    inputs:
      release-check-scope:
        description: Unique concurrency scope for a reusable release check.
        type: string
        required: false
        default: ''
      release-packages-artifact:
        description: Name of a pre-packed release candidate artifact to validate instead of packing locally.
        type: string
        required: false
        default: ''
  push:
    branches: [main]
  pull_request:
    paths:
      - 'version.json'
      - 'Configlue*.slnx'
      - 'global.json'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - 'tests/fixtures/consumers/**'
      - 'src/fragments/SparseFragments/README.md'
      - '.github/workflows/test-package-consumers.yaml'
      - '.github/workflows/scripts/verify-*.sh'
      - '.github/workflows/scripts/assert-supported-aot-diagnostics.sh'
      - '.github/workflows/scripts/assert-sparse-aot-diagnostics.sh'
  schedule:
    # Weekly drift cadence inherited from test-nativeaot.yaml (#275).
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release-check-scope || github.ref }}
  cancel-in-progress: true

jobs:
  package-basic:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Pack Configlue packages
        if: inputs.release-packages-artifact == ''
        run: dotnet pack Configlue.slnx --configuration Release --output artifacts/packages

      - name: Download release candidate packages
        if: inputs.release-packages-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.release-packages-artifact }}
          path: artifacts/packages

      - name: List release candidate packages
        if: inputs.release-packages-artifact != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "Validating release candidate artifact '${{ inputs.release-packages-artifact }}'."
          ls -l artifacts/packages/*.nupkg

      - name: Resolve local feed and package version
        shell: bash
        run: |
          set -euo pipefail
          package="$(ls artifacts/packages/SparseFragments.*.nupkg | head -n 1)"
          version="$(basename "$package" | sed -E 's/^SparseFragments\.(.+)\.nupkg$/\1/')"
          echo "CONFIGLUE_PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "CONFIGLUE_PACKAGE_FEED=$(realpath artifacts/packages)" >> "$GITHUB_ENV"

      - name: Verify README Quick Start sample
        run: bash ./.github/workflows/scripts/verify-readme-quickstart.sh artifacts/packages

      - name: Verify SparseFragments README samples
        run: bash ./.github/workflows/scripts/verify-sparsefragments-readme.sh artifacts/packages src/fragments/SparseFragments/README.md

      - name: Build and run basic consumer (net10.0)
        run: |
          set -euo pipefail
          dotnet build tests/fixtures/consumers/package-basic/PackageBasic.Consumer.csproj \
            --configuration Release --framework net10.0 \
            -p:ConfigluePackageVersion="$CONFIGLUE_PACKAGE_VERSION" \
            -p:RestoreAdditionalProjectSources="$CONFIGLUE_PACKAGE_FEED"
          dotnet tests/fixtures/consumers/package-basic/bin/Release/net10.0/PackageBasic.Consumer.dll

      - name: Build and run basic consumer (net8.0)
        run: |
          set -euo pipefail
          dotnet build tests/fixtures/consumers/package-basic/PackageBasic.Consumer.csproj \
            --configuration Release --framework net8.0 \
            -p:ConfigluePackageVersion="$CONFIGLUE_PACKAGE_VERSION" \
            -p:RestoreAdditionalProjectSources="$CONFIGLUE_PACKAGE_FEED"
          dotnet tests/fixtures/consumers/package-basic/bin/Release/net8.0/PackageBasic.Consumer.dll

      - name: Build and run standalone SparseFragments consumers
        run: |
          set -euo pipefail
          for framework in net8.0 net10.0; do
            dotnet build tests/fixtures/consumers/package-sparse/PackageSparse.Consumer.csproj \
              --configuration Release --framework "$framework" \
              -p:ConfigluePackageVersion="$CONFIGLUE_PACKAGE_VERSION" \
              -p:RestoreAdditionalProjectSources="$CONFIGLUE_PACKAGE_FEED"
            dotnet "tests/fixtures/consumers/package-sparse/bin/Release/$framework/PackageSparse.Consumer.dll"
          done

      - name: Build standalone consumer without built-in IsExternalInit
        run: |
          set -euo pipefail
          for framework in netstandard2.0 net48; do
            dotnet build tests/fixtures/consumers/package-sparse-netstandard/PackageSparse.NetStandard.Consumer.csproj \
              --configuration Release --framework "$framework" \
              -p:ConfigluePackageVersion="$CONFIGLUE_PACKAGE_VERSION" \
              -p:RestoreAdditionalProjectSources="$CONFIGLUE_PACKAGE_FEED"
          done

      - name: Assert facade transitive closure smoke (#261)
        run: |
          set -euo pipefail
          # Lightweight #261 smoke on the already-restored packed graph with no
          # new fixture/csproj. `dotnet list package --include-transitive` does
          # not forward -p:ConfigluePackageVersion, so it would re-evaluate the
          # wrong (ProjectReference) graph; obj/project.assets.json is the
          # restored ground truth instead. Quoted "id/" matching keeps
          # Microsoft.Extensions.DependencyInjection(.Abstractions) style
          # prefixes from false-positive matching.
          assets="tests/fixtures/consumers/package-basic/obj/project.assets.json"
          if [[ ! -f "$assets" ]]; then
            echo "Missing restored assets file '$assets'." >&2
            exit 1
          fi
          for required in Configlue.Core Configlue.Abstraction Configlue.Provider.Json Configlue.Source.Environment; do
            if ! grep -q "\"${required}/" "$assets"; then
              echo "Basic consumer graph is missing required facade dependency '${required}' (#261)." >&2
              exit 1
            fi
          done
          for forbidden in Configlue.Extensions.DI Configlue.Source.Http Configlue.Source.CommandLine Configlue.Transformer.AES Configlue.Transformer.Compression Configlue.Provider.Yaml Configlue.Provider.Xml Configlue.Provider.MessagePack System.CommandLine SharpYaml MessagePack Microsoft.Extensions.DependencyInjection Microsoft.Extensions.Http Microsoft.Extensions.Hosting; do
            if grep -q "\"${forbidden}/" "$assets"; then
              echo "Basic consumer graph leaks opt-in dependency '${forbidden}' (#261)." >&2
              exit 1
            fi
          done
          echo "Facade transitive-closure smoke passed."

      - name: Assert SparseFragments independence smoke
        run: |
          set -euo pipefail
          # SparseFragments must stand alone: the package-sparse consumer graph
          # must not contain any Configlue.* package. Same assets.json rationale
          # as the facade smoke above; no new fixture needed.
          assets="tests/fixtures/consumers/package-sparse/obj/project.assets.json"
          if [[ ! -f "$assets" ]]; then
            echo "Missing restored assets file '$assets'." >&2
            exit 1
          fi
          if grep -q '"Configlue\.' "$assets"; then
            echo "SparseFragments consumer graph must not reference Configlue packages:" >&2
            grep -o '"Configlue\.[^"]*"' "$assets" | sort -u >&2
            exit 1
          fi
          echo "SparseFragments independence smoke passed."

      - name: Upload failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: package-basic-results
          path: |
            artifacts/packages/*.nupkg
            tests/fixtures/consumers/package-basic/**/*.binlog
            tests/fixtures/consumers/package-sparse/**/*.binlog
          if-no-files-found: ignore
          retention-days: 7

  # Single supported NativeAOT contract (#275): a representative application
  # published from packed NuGet packages. It exercises the supported generated
  # JSON path and the supported closed-world MessagePack path, fails on any
  # Configlue trim/AOT diagnostic via assert-supported-aot-diagnostics.sh, and
  # executes the resulting native binary. This is the only NativeAOT publish in
  # CI; the former broad diagnostic consumer and the gate mutation probes were
  # removed as duplicate/observational verification.
  native-aot-supported:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Pack Configlue packages
        if: inputs.release-packages-artifact == ''
        run: dotnet pack Configlue.slnx --configuration Release --output artifacts/packages

      - name: Download release candidate packages
        if: inputs.release-packages-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.release-packages-artifact }}
          path: artifacts/packages

      - name: List release candidate packages
        if: inputs.release-packages-artifact != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "Validating release candidate artifact '${{ inputs.release-packages-artifact }}'."
          ls -l artifacts/packages/*.nupkg

      - name: Resolve local feed and package version
        shell: bash
        run: |
          set -euo pipefail
          package="$(ls artifacts/packages/SparseFragments.*.nupkg | head -n 1)"
          version="$(basename "$package" | sed -E 's/^SparseFragments\.(.+)\.nupkg$/\1/')"
          echo "CONFIGLUE_PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "CONFIGLUE_PACKAGE_FEED=$(realpath artifacts/packages)" >> "$GITHUB_ENV"

      - name: Self-test AOT diagnostic gate (synthetic logs)
        shell: bash
        run: |
          set -euo pipefail
          # Tripwire for the gate itself (#275): without a negative control the
          # supported-consumer publish below would stay green even if
          # assert-supported-aot-diagnostics.sh became blind (e.g. a regex that
          # matches nothing). These synthetic logs prove the script still
          # accepts the proven residual and rejects anything else, with no
          # extra NativeAOT publish cost.
          gate="./.github/workflows/scripts/assert-supported-aot-diagnostics.sh"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/positive.log" <<'EOF'
          ILC : AOT analysis warning IL3050: MessagePack.MessagePackSecurity.ObjectFallbackEqualityComparer.GetHashCode(Object): Using member 'System.Reflection.MethodInfo.MakeGenericMethod(Type[])' which has 'RequiresDynamicCodeAttribute' can break functionality when AOT compiling. The native code for this instantiation might not be available at runtime. [/home/runner/work/Configlue/Configlue/tests/fixtures/consumers/native-aot-supported/NativeAot.Supported.Consumer.csproj]
          ILC : Trim analysis warning IL2060: MessagePack.MessagePackSecurity.ObjectFallbackEqualityComparer.GetHashCode(Object): Call to 'System.Reflection.MethodInfo.MakeGenericMethod(Type[])' can not be statically analyzed. It's not possible to guarantee the availability of requirements of the generic method. [/home/runner/work/Configlue/Configlue/tests/fixtures/consumers/native-aot-supported/NativeAot.Supported.Consumer.csproj]
          EOF
          cat > "$tmp/empty.log" <<'EOF'
          Publish succeeded without trimming diagnostics.
          EOF
          cat > "$tmp/negative-configlue.log" <<'EOF'
          ILC : AOT analysis warning IL3050: MessagePack.MessagePackSecurity.ObjectFallbackEqualityComparer.GetHashCode(Object): Using member 'System.Reflection.MethodInfo.MakeGenericMethod(Type[])' which has 'RequiresDynamicCodeAttribute' can break functionality when AOT compiling. The native code for this instantiation might not be available at runtime. [/home/runner/work/Configlue/Configlue/tests/fixtures/consumers/native-aot-supported/NativeAot.Supported.Consumer.csproj]
          ILC : AOT analysis warning IL3050: Configlue.Provider.Json.JsonFragmentConverter`1.Read(System.Text.Json.Utf8JsonReader&,System.Type,System.Text.Json.JsonSerializerOptions): Using member 'System.Text.Json.JsonSerializer.Deserialize' which has 'RequiresDynamicCodeAttribute' can break functionality when AOT compiling. The native code for this instantiation might not be available at runtime. [/home/runner/work/Configlue/Configlue/tests/fixtures/consumers/native-aot-supported/NativeAot.Supported.Consumer.csproj]
          EOF
          cat > "$tmp/negative-code.log" <<'EOF'
          ILC : Trim analysis warning IL2026: Configlue.Core.Something.Do(): Using member 'System.Reflection.MethodInfo.Invoke' which has 'RequiresUnreferencedCodeAttribute' can break functionality when trimming application code. [/home/runner/work/Configlue/Configlue/tests/fixtures/consumers/native-aot-supported/NativeAot.Supported.Consumer.csproj]
          EOF
          if ! bash "$gate" "$tmp/positive.log"; then
            echo "Gate rejected the proven-residual-only log; it should have passed." >&2
            exit 1
          fi
          if ! bash "$gate" "$tmp/empty.log"; then
            echo "Gate rejected a diagnostic-free log; it should have passed." >&2
            exit 1
          fi
          if bash "$gate" "$tmp/negative-configlue.log"; then
            echo "Gate accepted a Configlue IL3050 diagnostic; it should have failed." >&2
            exit 1
          fi
          if bash "$gate" "$tmp/negative-code.log"; then
            echo "Gate accepted an unexpected IL2026 diagnostic; it should have failed." >&2
            exit 1
          fi
          echo "Diagnostic-gate self-test passed (positive/negative controls)."

      - name: Publish warning-clean NativeAOT consumer
        shell: bash
        run: |
          set -euo pipefail
          publish_log="$(mktemp)"
          trap 'rm -f "$publish_log"' EXIT
          # Release gate (#208, #251): the supported JSON surface (facade over
          # source-generated metadata plus generated fragment converters) and the
          # supported MessagePack surface (generated fragment formatters over an
          # explicit closed-world resolver/options object) must publish with no IL
          # trim/AOT diagnostics except the proven upstream residual asserted by
          # assert-supported-aot-diagnostics.sh. No warning-code or namespace
          # allowlist is applied here; any other diagnostic fails the gate.
          #
          # IlcTreatWarningsAsErrors is disabled only so the two proven-residual
          # warnings do not fail the publish itself; the assertion script is the
          # gate. Build-time trim/AOT analyzer diagnostics still fail the build
          # through TreatWarningsAsErrors.
          dotnet publish tests/fixtures/consumers/native-aot-supported/NativeAot.Supported.Consumer.csproj \
            --configuration Release --runtime linux-x64 --self-contained \
            -p:ConfigluePackageVersion="$CONFIGLUE_PACKAGE_VERSION" \
            -p:RestoreAdditionalProjectSources="$CONFIGLUE_PACKAGE_FEED" \
            -p:IlcTreatWarningsAsErrors=false 2>&1 | tee "$publish_log"

          bash ./.github/workflows/scripts/assert-supported-aot-diagnostics.sh "$publish_log"

      - name: Run warning-clean NativeAOT consumer
        run: |
          set -euo pipefail
          output="$(tests/fixtures/consumers/native-aot-supported/bin/Release/net10.0/linux-x64/publish/NativeAot.Supported.Consumer)"
          echo "$output"
          if [[ "$output" != *"CONFIGLUE_NATIVE_AOT_SUPPORTED_PASS"* ]]; then
            echo "The warning-clean NativeAOT consumer did not reach its success marker." >&2
            exit 1
          fi

      - name: Upload failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: native-aot-supported-results
          path: |
            artifacts/packages/*.nupkg
            tests/fixtures/consumers/native-aot-supported/**/*.binlog
          if-no-files-found: ignore
          retention-days: 7

  # Standalone SparseFragments NativeAOT contract (#317): a packed-package
  # consumer using only SparseFragments (+ SparseFragments.JsonPatch) published
  # with NativeAOT. It exercises fragment construction/From, merge, diff/patch
  # application, deep clone, and JSON Patch conversion through an explicit
  # source-generated JsonSerializerContext, fails on any IL trim/AOT diagnostic
  # via assert-sparse-aot-diagnostics.sh (including any SparseFragments-origin
  # diagnostic), and executes the resulting native binary.
  sparse-fragments-aot:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Pack Configlue packages
        if: inputs.release-packages-artifact == ''
        run: dotnet pack Configlue.slnx --configuration Release --output artifacts/packages

      - name: Download release candidate packages
        if: inputs.release-packages-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.release-packages-artifact }}
          path: artifacts/packages

      - name: List release candidate packages
        if: inputs.release-packages-artifact != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "Validating release candidate artifact '${{ inputs.release-packages-artifact }}'."
          ls -l artifacts/packages/*.nupkg

      - name: Resolve local feed and package version
        shell: bash
        run: |
          set -euo pipefail
          package="$(ls artifacts/packages/SparseFragments.*.nupkg | head -n 1)"
          version="$(basename "$package" | sed -E 's/^SparseFragments\.(.+)\.nupkg$/\1/')"
          echo "CONFIGLUE_PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "CONFIGLUE_PACKAGE_FEED=$(realpath artifacts/packages)" >> "$GITHUB_ENV"

      - name: Self-test SparseFragments AOT diagnostic gate (synthetic logs)
        shell: bash
        run: |
          set -euo pipefail
          # Tripwire for the gate itself (#317): without a negative control the
          # sparse-aot publish below would stay green even if
          # assert-sparse-aot-diagnostics.sh became blind (e.g. a regex that
          # matches nothing). These synthetic logs prove the script still
          # accepts a diagnostic-free log and rejects SparseFragments-origin
          # diagnostics, with no extra NativeAOT publish cost.
          gate="./.github/workflows/scripts/assert-sparse-aot-diagnostics.sh"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/empty.log" <<'EOF'
          Publish succeeded without trimming diagnostics.
          EOF
          cat > "$tmp/negative-sparse.log" <<'EOF'
          ILC : Trim analysis warning IL2026: SparseFragments.SparseCollectionMerger.Merge[T](SparseFragments.Optional`1[T],SparseFragments.Optional`1[T]): Using member 'System.Reflection.MethodInfo.Invoke' which has 'RequiresUnreferencedCodeAttribute' can break functionality when trimming application code. [/home/runner/work/Configlue/Configlue/tests/fixtures/consumers/sparse-aot/SparseAot.Consumer.csproj]
          EOF
          cat > "$tmp/negative-jsonpatch.log" <<'EOF'
          ILC : AOT analysis warning IL3050: SparseFragments.JsonPatch.JsonPatchEngine.Apply(System.Text.Json.Nodes.JsonNode,Boolean,SparseFragments.JsonPatch.JsonPatchDocument,System.StringComparison): Using member 'System.Text.Json.JsonSerializer.Deserialize' which has 'RequiresDynamicCodeAttribute' can break functionality when AOT compiling. The native code for this instantiation might not be available at runtime. [/home/runner/work/Configlue/Configlue/tests/fixtures/consumers/sparse-aot/SparseAot.Consumer.csproj]
          EOF
          if ! bash "$gate" "$tmp/empty.log"; then
            echo "Gate rejected a diagnostic-free log; it should have passed." >&2
            exit 1
          fi
          if bash "$gate" "$tmp/negative-sparse.log"; then
            echo "Gate accepted a SparseFragments IL2026 diagnostic; it should have failed." >&2
            exit 1
          fi
          if bash "$gate" "$tmp/negative-jsonpatch.log"; then
            echo "Gate accepted a SparseFragments.JsonPatch IL3050 diagnostic; it should have failed." >&2
            exit 1
          fi
          echo "SparseFragments diagnostic-gate self-test passed (positive/negative controls)."

      - name: Publish SparseFragments NativeAOT consumer
        shell: bash
        run: |
          set -euo pipefail
          publish_log="$(mktemp)"
          trap 'rm -f "$publish_log"' EXIT
          # Release gate (#317): the standalone SparseFragments surface
          # (generated fragment/patch plus the JsonPatch bridge over an explicit
          # source-generated resolver) must publish with no IL trim/AOT
          # diagnostics. The consumer project sets IlcTreatWarningsAsErrors, so
          # the publish itself fails on any ILC warning; the assertion script is
          # the explicit SparseFragments-origin gate. No warning-code or
          # namespace allowlist is applied here.
          dotnet publish tests/fixtures/consumers/sparse-aot/SparseAot.Consumer.csproj \
            --configuration Release --runtime linux-x64 --self-contained \
            -p:ConfigluePackageVersion="$CONFIGLUE_PACKAGE_VERSION" \
            -p:RestoreAdditionalProjectSources="$CONFIGLUE_PACKAGE_FEED" 2>&1 | tee "$publish_log"

          bash ./.github/workflows/scripts/assert-sparse-aot-diagnostics.sh "$publish_log"

          # SparseFragments must stand alone: the published graph must not
          # contain any Configlue.* package (same assets.json rationale as the
          # facade smoke above; no new fixture needed).
          assets="tests/fixtures/consumers/sparse-aot/obj/project.assets.json"
          if [[ ! -f "$assets" ]]; then
            echo "Missing restored assets file '$assets'." >&2
            exit 1
          fi
          if grep -q '"Configlue\.' "$assets"; then
            echo "SparseFragments NativeAOT consumer graph must not reference Configlue packages:" >&2
            grep -o '"Configlue\.[^"]*"' "$assets" | sort -u >&2
            exit 1
          fi
          echo "SparseFragments NativeAOT independence smoke passed."

      - name: Run SparseFragments NativeAOT consumer
        run: |
          set -euo pipefail
          output="$(tests/fixtures/consumers/sparse-aot/bin/Release/net10.0/linux-x64/publish/SparseAot.Consumer)"
          echo "$output"
          if [[ "$output" != *"SPARSE_AOT_SMOKE_PASS"* ]]; then
            echo "The SparseFragments NativeAOT consumer did not reach its success marker." >&2
            exit 1
          fi

      - name: Upload failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: sparse-fragments-aot-results
          path: |
            artifacts/packages/*.nupkg
            tests/fixtures/consumers/sparse-aot/**/*.binlog
          if-no-files-found: ignore
          retention-days: 7
