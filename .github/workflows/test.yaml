name: Quick tests

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Configlue.slnx

      - name: Build
        run: dotnet build Configlue.slnx --no-restore --configuration Release

      # Integration tests (Redis/PostgreSQL/S3) self-skip without their
      # opt-in environment variables, so this stays a fast unit-only run.
      - name: Run tests
        run: >
          dotnet test --solution Configlue.slnx --no-build --no-restore
          --configuration Release --framework net10.0
          -- --timeout 5m --report-trx --results-directory TestResults --no-progress

      - name: Upload failure test artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: quick-test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/*.xml
            tests/**/TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7
