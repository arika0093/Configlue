name: DevTools browser smoke

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - src/devtools/**
      - tests/Configlue.DevTools.Browser.Tests/**
      - tests/Configlue.DevTools.Tests/**
      - .github/workflows/test-devtools-browser.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monaco-smoke:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/Configlue.DevTools.Browser.Tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/Configlue.DevTools.Browser.Tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (on demand)
        run: npx playwright install chromium

      - name: Run Monaco smoke test
        run: npm test
