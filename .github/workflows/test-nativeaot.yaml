name: NativeAOT tests

# NativeAOT single entry point (#273). Invoked only through the Tier 2
# main/release gate (test-strict.yaml, itself called by release.yaml) plus
# scheduled/manual runs below — never directly on pull requests and never
# through both quick and strict paths. (The packed-package NativeAOT
# consumer probes in test-package-consumers.yaml cover a different surface:
# published NuGet packages rather than this in-repo test project.)

on:
  workflow_call:
    inputs:
      release-check-scope:
        description: Unique concurrency scope for a reusable release check.
        type: string
        required: false
        default: ''
  schedule:
    # Weekly cadence independent of main/release pushes.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-nativeaot-${{ inputs.release-check-scope || github.ref }}
  cancel-in-progress: true

jobs:
  native-aot:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Publish NativeAOT tests
        run: >
          dotnet publish tests/Configlue.Tests/Configlue.Tests.csproj
          --configuration Release
          --framework net10.0
          --runtime linux-x64
          --self-contained true
          -p:ConfiglueNativeAot=true

      - name: Run NativeAOT JSON test
        run: >
          tests/Configlue.Tests/bin/Release/net10.0/linux-x64/publish/Configlue.Tests
          --treenode-filter '/*/*/*/*JsonAot*'
          --timeout 5m
          --progress off

      - name: Run NativeAOT MessagePack test
        run: >
          tests/Configlue.Tests/bin/Release/net10.0/linux-x64/publish/Configlue.Tests
          --treenode-filter '/*/*/*/*MessagePackAot*'
          --timeout 5m
          --progress off
