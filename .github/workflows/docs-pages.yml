name: Docs site

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'docs/**'
      - 'example/**'
      - 'src/**'
      - 'README.md'
      - '.github/workflows/docs-pages.yml'
  pull_request:
    paths:
      - 'docs-site/**'
      - 'docs/**'
      - 'example/**'
      - 'src/**'
      - 'README.md'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CONFIGLUE_DOCS_SITE: https://arika0093.github.io
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v6

      - name: Set Pages base path
        if: github.ref == 'refs/heads/main'
        run: echo "CONFIGLUE_DOCS_BASE=${{ steps.pages.outputs.base_path }}" >> "$GITHUB_ENV"

      - name: Build documentation
        working-directory: docs-site
        run: npm run build

      - name: Prefix root-relative links for project Pages
        working-directory: docs-site
        run: node scripts/prefix-base-paths.mjs dist "$CONFIGLUE_DOCS_BASE"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
