name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    outputs:
      run-dotnet: ${{ steps.checks.outputs.run-dotnet }}
      run-npm: ${{ steps.checks.outputs.run-npm }}
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Run only the necessary ones.
      # Action updates can affect both the product CI and the docs CI.
      # NOTE: dependabot/fetch-metadata reports ecosystem names with
      # underscores (npm_and_yarn, github_actions) and per-project
      # directories for nuget (e.g. /src/devtools/... instead of /),
      # so match on ecosystem with a directory wildcard where the
      # selected checks are not directory-sensitive.
      # Observed values: nuget:/src/..., npm_and_yarn:/docs-site,
      # github_actions:/
      - name: Select checks
        id: checks
        shell: bash
        env:
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          DIRECTORY: ${{ steps.metadata.outputs.directory }}
        run: |
          set -euo pipefail

          echo "run-dotnet=false" >> "$GITHUB_OUTPUT"
          echo "run-npm=false" >> "$GITHUB_OUTPUT"

          case "$PACKAGE_ECOSYSTEM:$DIRECTORY" in
            nuget:*)
              echo "run-dotnet=true" >> "$GITHUB_OUTPUT"
              ;;
            npm_and_yarn:/docs-site)
              echo "run-npm=true" >> "$GITHUB_OUTPUT"
              ;;
            github_actions:*)
              echo "run-dotnet=true" >> "$GITHUB_OUTPUT"
              echo "run-npm=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unsupported Dependabot target: $PACKAGE_ECOSYSTEM:$DIRECTORY"
              exit 1
              ;;
          esac

  dotnet-strict:
    needs: metadata
    if: needs.metadata.outputs.run-dotnet == 'true'
    uses: ./.github/workflows/test.yaml

  npm-build:
    needs: metadata
    if: needs.metadata.outputs.run-npm == 'true'
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build docs (dry-run)
        working-directory: docs-site
        run: npm run build

  dependabot-merge:
    runs-on: ubuntu-latest
    needs:
      - metadata
      - dotnet-strict
      - npm-build
    if: >-
      always() &&
      needs.metadata.result == 'success' &&
      (needs.dotnet-strict.result == 'success' || needs.dotnet-strict.result == 'skipped') &&
      (needs.npm-build.result == 'success' || needs.npm-build.result == 'skipped')
    steps:
      - name: Merge Dependabot PR
        shell: bash
        run: |
          set -euo pipefail

          if output="$(gh pr merge --auto --squash "$PR_URL" 2>&1)"; then
            echo "$output"
            exit 0
          fi

          echo "$output"

          if grep -Fq "Protected branch rules not configured for this branch" <<<"$output"; then
            echo "GitHub auto-merge requires branch protection; merging now because the selected dependency checks succeeded."
            gh pr merge --squash "$PR_URL"
          else
            exit 1
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
