name: PostgreSQL integration tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgresql-integration:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: configlue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CONFIGLUE_POSTGRES_INTEGRATION: "1"
      CONFIGLUE_POSTGRES_CONNECTION: "Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=configlue"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore tests/Configlue.Tests/Configlue.Tests.csproj

      - name: Build
        run: >
          dotnet build tests/Configlue.Tests/Configlue.Tests.csproj
          --no-restore --configuration Release --framework net10.0

      - name: Run PostgreSQL integration tests
        run: >
          dotnet test tests/Configlue.Tests/Configlue.Tests.csproj
          --no-build --no-restore --configuration Release --framework net10.0
          -- --treenode-filter "/*/*/*PostgreSqlSourceIntegrationTests/*"
          --timeout 5m --report-trx --results-directory TestResults --no-progress

      - name: Upload failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: postgresql-integration-results
          path: |
            TestResults/**/*.trx
            tests/Configlue.Tests/bin/Release/net10.0/TestResults/**
          if-no-files-found: ignore
          retention-days: 7
