name: Release packages

# Release gate: test.yaml owns the 3-OS solution matrix, observational
# coverage, Windows host tests, packed asset verification and the nested
# Godot smoke check; the remaining jobs cover external-service
# integration (redis/postgresql/s3), packed-package consumers (including
# the supported NativeAOT consumers) and the Unity contract matrix.
#
# Pack-once release flow (#337): package-candidate packs the canonical
# release candidate .nupkg set once and uploads it as a workflow artifact.
# Packed-consumer / NativeAOT validation consumes that artifact via a local
# feed, and GitHub Release / NuGet publication publish those same bytes
# without repacking. Ordinary non-release CI keeps packing independently;
# only this release path is immutable.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - version.json

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x

jobs:
  # Canonical release candidate (#337): packed once, validated by release
  # gates, and published byte-for-byte. Version truth stays with
  # Nerdbank.GitVersioning; no second version source is introduced.
  package-candidate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.semver }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Read package version
        uses: dotnet/nbgv@master
        id: nbgv

      - name: Export package version
        id: version
        env:
          SEMVER: ${{ steps.nbgv.outputs.SemVer2 }}
        run: echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore Configlue.slnx

      - name: Build
        run: dotnet build Configlue.slnx --no-restore --configuration Release

      - name: Pack NuGet packages
        run: dotnet pack Configlue.slnx --no-build --no-restore --configuration Release --output artifacts

      - name: Verify release candidate packages
        run: bash ./.github/workflows/scripts/verify-packages.sh artifacts

      - name: Upload release candidate packages
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-packages
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 1

  strict-test:
    uses: ./.github/workflows/test.yaml

  redis-integration:
    uses: ./.github/workflows/test-integration-redis.yaml
    with:
      release-check-scope: release-redis

  postgresql-integration:
    uses: ./.github/workflows/test-integration-postgresql.yaml
    with:
      release-check-scope: release-postgresql

  s3-integration:
    uses: ./.github/workflows/test-integration-s3.yaml
    with:
      release-check-scope: release-s3

  package-consumers:
    needs: package-candidate
    uses: ./.github/workflows/test-package-consumers.yaml
    with:
      release-check-scope: release-package-consumers
      release-packages-artifact: release-candidate-packages

  unity-contract:
    uses: ./.github/workflows/test-unity-contract.yaml
    with:
      release-check-scope: release-unity-contract

  release-github:
    # No post-validation repack (#337): publish the exact validated
    # release-candidate-packages bytes. Every release gate must succeed.
    if: >-
      github.ref == 'refs/heads/main'
      && needs.package-candidate.result == 'success'
      && needs.strict-test.result == 'success'
      && needs.redis-integration.result == 'success'
      && needs.postgresql-integration.result == 'success'
      && needs.s3-integration.result == 'success'
      && needs.package-consumers.result == 'success'
      && needs.unity-contract.result == 'success'
    runs-on: ubuntu-latest
    needs:
      - package-candidate
      - strict-test
      - redis-integration
      - postgresql-integration
      - s3-integration
      - package-consumers
      - unity-contract
    permissions:
      contents: write
    steps:
      - name: Download release candidate packages
        uses: actions/download-artifact@v8
        with:
          name: release-candidate-packages
          path: artifacts

      - name: List published packages
        shell: bash
        run: |
          set -euo pipefail
          echo "Publishing validated release candidate '${{ needs.package-candidate.outputs.version }}'."
          ls -l artifacts/*.nupkg

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.package-candidate.outputs.version }}
          tag_name: ${{ needs.package-candidate.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/*.nupkg
          prerelease: ${{ contains(needs.package-candidate.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-nuget:
    # No post-validation repack (#337): publish the exact validated
    # release-candidate-packages bytes. Every release gate must succeed.
    if: >-
      github.ref == 'refs/heads/main'
      && needs.package-candidate.result == 'success'
      && needs.strict-test.result == 'success'
      && needs.redis-integration.result == 'success'
      && needs.postgresql-integration.result == 'success'
      && needs.s3-integration.result == 'success'
      && needs.package-consumers.result == 'success'
      && needs.unity-contract.result == 'success'
    runs-on: ubuntu-latest
    needs:
      - package-candidate
      - strict-test
      - redis-integration
      - postgresql-integration
      - s3-integration
      - package-consumers
      - unity-contract
    permissions:
      id-token: write
    steps:
      - name: Download release candidate packages
        uses: actions/download-artifact@v8
        with:
          name: release-candidate-packages
          path: artifacts

      - name: List published packages
        shell: bash
        run: |
          set -euo pipefail
          echo "Publishing validated release candidate '${{ needs.package-candidate.outputs.version }}'."
          ls -l artifacts/*.nupkg

      - name: Authenticate to NuGet
        uses: NuGet/login@v1
        id: login
        with:
          user: arika0093

      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
