name: Release packages

# Tier 2 / release gate (#273). Auditable required checks before pack +
# publish: strict-test owns the 3-OS solution matrix, observational
# coverage, Windows host tests, packed asset verification and the nested
# Godot smoke + NativeAOT checks; the remaining jobs cover external-service
# integration (redis/postgresql/s3), packed-package consumers (including
# NativeAOT consumer probes) and the Unity contract matrix.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - version.json

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x

jobs:
  strict-test:
    uses: ./.github/workflows/test-strict.yaml

  redis-integration:
    uses: ./.github/workflows/test-integration-redis.yaml
    with:
      release-check-scope: release-redis

  postgresql-integration:
    uses: ./.github/workflows/test-integration-postgresql.yaml
    with:
      release-check-scope: release-postgresql

  s3-integration:
    uses: ./.github/workflows/test-integration-s3.yaml
    with:
      release-check-scope: release-s3

  package-consumers:
    uses: ./.github/workflows/test-package-consumers.yaml
    with:
      release-check-scope: release-package-consumers

  unity-contract:
    uses: ./.github/workflows/test-unity-contract.yaml
    with:
      release-check-scope: release-unity-contract

  package-build:
    if: >-
      github.ref == 'refs/heads/main'
      && needs.strict-test.result == 'success'
      && needs.redis-integration.result == 'success'
      && needs.postgresql-integration.result == 'success'
      && needs.s3-integration.result == 'success'
      && needs.package-consumers.result == 'success'
      && needs.unity-contract.result == 'success'
    runs-on: ubuntu-latest
    needs:
      - strict-test
      - redis-integration
      - postgresql-integration
      - s3-integration
      - package-consumers
      - unity-contract
    outputs:
      version: ${{ steps.version.outputs.semver }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Read package version
        uses: dotnet/nbgv@master
        id: nbgv

      - name: Export package version
        id: version
        env:
          SEMVER: ${{ steps.nbgv.outputs.SemVer2 }}
        run: echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore Configlue.slnx

      - name: Build
        run: dotnet build Configlue.slnx --no-restore --configuration Release

      - name: Pack NuGet packages
        run: dotnet pack Configlue.slnx --no-build --no-restore --configuration Release --output artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 1

  release-github:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: package-build
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.package-build.outputs.version }}
          tag_name: ${{ needs.package-build.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/*.nupkg
          prerelease: ${{ contains(needs.package-build.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-nuget:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: package-build
    permissions:
      id-token: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts

      - name: Authenticate to NuGet
        uses: NuGet/login@v1
        id: login
        with:
          user: arika0093

      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
