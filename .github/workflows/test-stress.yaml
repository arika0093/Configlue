name: Stress tests

on:
  workflow_call:
    inputs:
      iterations:
        description: Number of repetitions for each stress filter.
        type: string
        required: false
        default: "5"
  workflow_dispatch:
    inputs:
      iterations:
        description: Number of repetitions for each stress filter.
        required: false
        default: "5"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stress:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: configlue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      localstack:
        image: localstack/localstack:4.0
        env:
          SERVICES: s3
          DEBUG: "0"
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      CONFIGLUE_REDIS_INTEGRATION: "1"
      CONFIGLUE_REDIS_CONNECTION: "localhost:6379"
      CONFIGLUE_POSTGRES_INTEGRATION: "1"
      CONFIGLUE_POSTGRES_CONNECTION: "Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=configlue"
      CONFIGLUE_S3_INTEGRATION: "1"
      CONFIGLUE_S3_SERVICE_URL: "http://localhost:4566"
      CONFIGLUE_S3_ACCESS_KEY: "test"
      CONFIGLUE_S3_SECRET_KEY: "test"
      CONFIGLUE_S3_REGION: "us-east-1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore tests/Configlue.Tests/Configlue.Tests.csproj

      - name: Build
        run: >
          dotnet build tests/Configlue.Tests/Configlue.Tests.csproj
          --no-restore --configuration Release --framework net10.0

      - name: Run repeated stress filters without retry
        shell: bash
        env:
          STRESS_ITERATIONS: ${{ inputs.iterations || '5' }}
        run: |
          set -euo pipefail
          filters=(
            "/*/*/*StateRuntimeTests/*"
            "/*/*/*RuntimeLifetimeTests/*"
            "/*/*/*StateSourceResolverCacheTests/*"
            "/*/*/*FileResourceTests/*"
            "/*/*/*StateHttpTransportTests/*"
            "/*/*/*StateHttpPatchTests/*"
            "/*/*/*SubjectRoutingTests/*"
            "/*/*/*RedisResourceIntegrationTests/*"
            "/*/*/*PostgreSqlSourceIntegrationTests/*"
            "/*/*/*S3ObjectIntegrationTests/*"
          )
          for iteration in $(seq 1 "${STRESS_ITERATIONS}"); do
            echo "::group::stress iteration ${iteration}"
            for filter in "${filters[@]}"; do
              echo "Running ${filter}"
              dotnet test tests/Configlue.Tests/Configlue.Tests.csproj \
                --no-build --no-restore --configuration Release --framework net10.0 \
                -- --treenode-filter "${filter}" --timeout 5m --no-progress
            done
            echo "::endgroup::"
          done

      - name: Capture service logs
        if: failure() || cancelled()
        continue-on-error: true
        run: |
          mkdir -p diagnostics
          for container in $(docker ps -aq); do
            docker logs "$container" > "diagnostics/$container.log" 2>&1 || true
          done

      - name: Upload failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: stress-results
          path: |
            tests/Configlue.Tests/bin/Release/net10.0/TestResults/**
            diagnostics/**
          if-no-files-found: ignore
          retention-days: 7
