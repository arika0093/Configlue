name: Strict tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore .NET tools
        if: matrix.os == 'ubuntu-latest'
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore Configlue.slnx

      - name: Build
        run: dotnet build Configlue.slnx --no-restore --configuration Release

      - name: Run tests
        run: >
          dotnet test --solution Configlue.slnx --no-build --no-restore
          --configuration Release --framework net10.0
          -- --timeout 5m --report-trx --results-directory TestResults --no-progress

      - name: Collect code coverage (observation)
        if: matrix.os == 'ubuntu-latest'
        run: >
          dotnet test tests/Configlue.Tests/Configlue.Tests.csproj
          --no-build --no-restore --configuration Release --framework net10.0
          -- --timeout 5m --coverage --coverage-settings tests/coverage.config
          --coverage-output coverage.cobertura.xml --coverage-output-format cobertura
          --results-directory TestResults/coverage --no-progress

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: TestResults/coverage/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failure test artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: strict-test-results-${{ matrix.os }}
          path: |
            TestResults/**/*.trx
            TestResults/**/*.xml
            tests/**/TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

      - name: Run .NET Framework portable tests
        if: matrix.os == 'windows-latest'
        # Several race tests deliberately block worker threads at barriers. Bound
        # concurrent test bodies on the legacy pool so their releasing continuations
        # can run on the small CI worker; concurrency inside each test is unchanged.
        run: >
          dotnet test tests/Configlue.Tests/Configlue.Tests.csproj
          --framework net48 --runtime win-x86 --configuration Release
          -- --timeout 5m --maximum-parallel-tests 2
          --report-trx --no-progress

      - name: Build Windows host integrations
        if: matrix.os == 'windows-latest'
        run: >
          dotnet build Configlue.Hosting.Windows.slnx --configuration Release
          -p:ShouldUnsetParentConfigurationAndPlatform=false

      - name: Run WPF and Windows Forms native UI tests
        if: matrix.os == 'windows-latest'
        run: >
          dotnet run --project tests/Configlue.Hosting.Desktop.Tests
          --no-build --no-restore --configuration Release
          -- --timeout 5m --report-trx --no-progress

      - name: Run WinUI native queue tests
        if: matrix.os == 'windows-latest'
        run: >
          dotnet run --project tests/Configlue.Hosting.WinUI.Tests
          --no-build --no-restore --configuration Release
          -- --timeout 5m --report-trx --no-progress

      - name: Pack NuGet packages
        run: >
          dotnet pack Configlue.slnx --no-build --no-restore
          --configuration Release --output artifacts

      - name: Run native MAUI Windows smoke tests
        if: matrix.os == 'windows-latest'
        run: >
          dotnet run --project tests/Configlue.Hosting.Maui.Windows.Tests
          --no-build --no-restore --configuration Release
          -- --timeout 5m --report-trx --no-progress

      - name: Verify packed target assets
        if: matrix.os == 'ubuntu-latest'
        run: bash ./.github/workflows/scripts/verify-packages.sh artifacts

      - name: Pack Windows host integrations
        if: matrix.os == 'windows-latest'
        run: >
          dotnet pack Configlue.Hosting.Windows.slnx --no-build --no-restore
          --configuration Release --output artifacts

  native-godot:
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack consumer dependencies
        run: dotnet pack Configlue.slnx --configuration Release --output artifacts/packages

      - name: Build the packed Godot consumer
        shell: pwsh
        run: |
          $package = Get-ChildItem artifacts/packages -Filter 'Configlue.Hosting.Godot.*.nupkg' | Select-Object -First 1
          $version = [regex]::Match($package.Name, '^Configlue\.Hosting\.Godot\.(.+)\.nupkg$').Groups[1].Value
          if (!$version) { throw 'Godot hosting package was not produced.' }
          $feed = (Resolve-Path artifacts/packages).Path
          dotnet build tests/Configlue.Hosting.Godot.Smoke/Configlue.Hosting.Godot.Smoke.csproj -p:ConfigluePackageVersion=$version -p:RestoreAdditionalProjectSources=$feed
          if ($LASTEXITCODE -ne 0) { throw 'Packed Godot consumer build failed.' }

      - name: Run native Godot smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/engines | Out-Null
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_win64.zip' -OutFile artifacts/engines/godot.zip
          Expand-Archive artifacts/engines/godot.zip artifacts/engines/godot
          $engine = (Get-ChildItem artifacts/engines/godot -Recurse -Filter '*console.exe' | Select-Object -First 1).FullName
          & $engine --headless --path tests/Configlue.Hosting.Godot.Smoke --editor --import --quit
          if ($LASTEXITCODE -ne 0) { throw 'Godot import failed.' }
          $output = & $engine --headless --path tests/Configlue.Hosting.Godot.Smoke --quit-after 1200 --max-fps 60 2>&1
          $output | Tee-Object -FilePath artifacts/godot-smoke.log | Write-Output
          if ($LASTEXITCODE -ne 0 -or ($output -join "`n") -notmatch 'CONFIGLUE_GODOT_SMOKE_PASS') { throw 'Native Godot smoke failed or timed out.' }

      - name: Upload failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: native-godot-results
          path: artifacts/godot-smoke.log
          if-no-files-found: ignore
          retention-days: 7

  native-aot:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish NativeAOT tests
        run: >
          dotnet publish tests/Configlue.Tests/Configlue.Tests.csproj
          --configuration Release
          --framework net10.0
          --runtime linux-x64
          --self-contained true
          -p:ConfiglueNativeAot=true

      - name: Run NativeAOT JSON test
        run: >
          tests/Configlue.Tests/bin/Release/net10.0/linux-x64/publish/Configlue.Tests
          --treenode-filter '/*/*/*/*JsonAot*'
          --timeout 5m
          --progress off

      - name: Run NativeAOT MessagePack test
        run: >
          tests/Configlue.Tests/bin/Release/net10.0/linux-x64/publish/Configlue.Tests
          --treenode-filter '/*/*/*/*MessagePackAot*'
          --timeout 5m
          --progress off
