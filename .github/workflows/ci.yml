name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Configlue.slnx
      - run: dotnet build Configlue.slnx --no-restore --configuration Release
      - run: dotnet test --solution Configlue.slnx --no-build --configuration Release
      - name: Pack NuGet packages
        run: dotnet pack Configlue.slnx --no-build --no-restore --configuration Release --output artifacts
      - name: Verify package contents
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: ./eng/VerifyPackages.ps1 -PackageDirectory artifacts
